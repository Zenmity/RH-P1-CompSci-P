<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists and Loops</title>

    <link rel="stylesheet" href="list.css" />
    <!-- Sketch file -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="pokemon.js"></script>
  </head>

  <body class="bg-slate-100">
    <h1 class="text-3xl font-bold p-6">List and Loop Basics</h1>
    <button
      id="randomBtn"
      class="bg-blue-600 text-white font-bold px-4 py-2 m-4 rounded-xl hover:bg-blue-700"
    >
      Get 4 Random Pokémon
    </button>
    <div
      id="cards"
      class="grid grid-cols-6 justify-evenly justify-items-center"
    >
      <!-- track -->
      <div class="bg-gray-200 rounded-full h-2">
        <!-- fill -->
        <div class="bg-emerald-500 rounded-full h-2" style="width: 45%"></div>
      </div>
    </div>
  </body>
</html>
